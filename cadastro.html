<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <title>Criar Conta — Tico Bot</title>
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="site-enhancements.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-emoji">🤖</span>
        <h1>Tico Bot</h1>
        <p class="brand-sub">Criar Conta</p>
      </div>

      <form id="cadastroForm" novalidate>
        <div class="field-group">
          <label for="idWhatsApp">Número do WhatsApp</label>
          <input id="idWhatsApp" type="tel" placeholder="5565999999999"
            autocomplete="tel" maxlength="15" required />
          <span class="field-hint">DDI + DDD + número, só dígitos. Ex: 5565912345678</span>
          <button type="button" class="btn-secondary" id="btnEnviarCodigo">Enviar código para WhatsApp</button>
        </div>

        <div class="field-group">
          <label for="codigo">Código de verificação</label>
          <input id="codigo" type="text" placeholder="Código de 6 dígitos"
            autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required />
          <span class="field-hint">O código é enviado em uma conversa privada com o bot e expira em 10 minutos.</span>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="seu@email.com"
            autocomplete="email" maxlength="254" required />
          <span class="field-hint">Também serve para entrar na conta; a recuperação exige o WhatsApp cadastrado.</span>
        </div>

        <div class="field-group">
          <label for="username">Nome de usuário</label>
          <input id="username" type="text" placeholder="seu_usuario"
            autocomplete="username" maxlength="30" required />
          <span class="field-hint">3–30 caracteres. Letras, números e _</span>
        </div>

        <div class="field-group">
          <label for="password">Senha</label>
          <div class="password-wrap">
            <input id="password" type="password" placeholder="Mínimo 10 caracteres (máx. 72 bytes)"
              autocomplete="new-password" minlength="10" maxlength="72" required />
            <button type="button" class="toggle-pw" aria-label="Mostrar senha" tabindex="-1">👁️</button>
          </div>
        </div>

        <div class="field-group">
          <label for="passwordConfirm">Confirmar senha</label>
          <div class="password-wrap">
            <input id="passwordConfirm" type="password" placeholder="Repita a senha"
              autocomplete="new-password" minlength="10" maxlength="72" required />
            <button type="button" class="toggle-pw2" aria-label="Mostrar senha" tabindex="-1">👁️</button>
          </div>
        </div>

        <div id="cadastroMsg" class="msg hidden"></div>

        <button type="submit" class="btn-primary" id="btnCadastrar">
          <span class="btn-label">Criar conta</span>
          <span class="btn-spinner hidden">⏳</span>
        </button>
      </form>

      <p class="auth-footer">
        Já tem conta? <a href="login.html">Entrar</a>
      </p>
    </div>
  </div>

  <script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3000/api'
      : 'https://tico-bot-6jpn.onrender.com/api';

    const legacyJwt = localStorage.getItem('jwt');
    if (legacyJwt && !sessionStorage.getItem('piro_jwt')) sessionStorage.setItem('piro_jwt', legacyJwt);
    localStorage.removeItem('jwt');
    if (sessionStorage.getItem('piro_jwt')) window.location.replace('perfil.html');

    const form   = document.getElementById('cadastroForm');
    const btnEnviarCodigo = document.getElementById('btnEnviarCodigo');
    const btn    = document.getElementById('btnCadastrar');
    const msgBox = document.getElementById('cadastroMsg');

    document.querySelector('.toggle-pw').addEventListener('click', () => {
      const inp = document.getElementById('password');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      document.querySelector('.toggle-pw').textContent = show ? '🙈' : '👁️';
    });
    document.querySelector('.toggle-pw2').addEventListener('click', () => {
      const inp = document.getElementById('passwordConfirm');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      document.querySelector('.toggle-pw2').textContent = show ? '🙈' : '👁️';
    });

    function setLoading(on) {
      btn.disabled = on;
      btn.querySelector('.btn-label').classList.toggle('hidden', on);
      btn.querySelector('.btn-spinner').classList.toggle('hidden', !on);
    }

    function showMsg(text, tipo = 'error') {
      msgBox.textContent = text;
      msgBox.className = `msg msg--${tipo}`;
    }

    function msgPorStatus(status, serverMsg) {
      if (status === 400) {
        const seguros = ['entre 3 e 30', 'letras, números', 'entre 10 e 128', '72 bytes', 'mínimo 10', 'já está em uso', 'Perfil não encontrado'];
        if (serverMsg && seguros.some(s => serverMsg.includes(s))) return serverMsg;
        return 'Dados inválidos. Verifique os campos e tente novamente.';
      }
      if (status === 404) return 'Número não encontrado. Mande uma mensagem no grupo primeiro.';
      if (status === 429) return serverMsg && serverMsg.includes('3 recriações') ? serverMsg : 'Muitas tentativas. Aguarde alguns minutos.';
      if (status >= 500) return 'Servidor indisponível. Tente novamente mais tarde.';
      return 'Erro ao criar conta.';
    }

    async function enviarCodigo() {
      const rawTel = document.getElementById('idWhatsApp').value;
      const numero = rawTel.replace(/\D/g, '');
      if (!numero || numero.length < 8 || numero.length > 15) {
        showMsg('Número inválido. Informe DDI + DDD + número, somente dígitos.');
        return;
      }

      btnEnviarCodigo.disabled = true;
      btnEnviarCodigo.textContent = 'Enviando…';
      try {
        const res = await fetch(`${API}/auth/otp/enviar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idWhatsApp: `${numero}@s.whatsapp.net` }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 429) {
          showMsg('Muitas solicitações. Aguarde alguns minutos antes de tentar novamente.');
          return;
        }
        if (res.status >= 500) {
          showMsg('Serviço de mensagens indisponível. Tente novamente mais tarde.');
          return;
        }
        if (!res.ok) {
          showMsg(data.error || 'Confira o número informado e tente novamente.');
          return;
        }
        showMsg(data.message || 'Se o número estiver associado a um perfil elegível, você receberá um código no WhatsApp privado.', 'info');
        document.getElementById('codigo').focus();
      } catch {
        showMsg('Não foi possível conectar ao servidor. Confira sua conexão e tente novamente.');
      } finally {
        btnEnviarCodigo.disabled = false;
        btnEnviarCodigo.textContent = 'Enviar código para WhatsApp';
      }
    }

    btnEnviarCodigo.addEventListener('click', enviarCodigo);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const rawTel          = document.getElementById('idWhatsApp').value;
      const idWhatsAppNum   = rawTel.replace(/\D/g, '');
      const email           = document.getElementById('email').value.trim();
      const username        = document.getElementById('username').value.trim();
      const password        = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;
      const codigo = document.getElementById('codigo').value.trim();

      if (!idWhatsAppNum || idWhatsAppNum.length < 10 || idWhatsAppNum.length > 15) {
        showMsg('Número inválido. Use DDI + DDD + número (só dígitos).');
        return;
      }
      if (!email || !email.includes('@')) {
        showMsg('Digite um email válido.');
        return;
      }
      if (username.length < 3) {
        showMsg('Nome de usuário muito curto (mínimo 3 caracteres).');
        return;
      }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        showMsg('Usuário só pode ter letras, números e _.');
        return;
      }
      if (password.length < 10) {
        showMsg('Senha muito curta (mínimo 10 caracteres).');
        return;
      }
      if (new TextEncoder().encode(password).length > 72) {
        showMsg('A senha deve ter no máximo 72 bytes em UTF-8. Evite palavras muito longas ou emojis.');
        return;
      }
      if (!/^\d{6}$/.test(codigo)) {
        showMsg('Informe o código de verificação de 6 dígitos recebido no WhatsApp privado.');
        return;
      }
      if (password !== passwordConfirm) {
        showMsg('As senhas não conferem.');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch(`${API}/auth/cadastrar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idWhatsApp: `${idWhatsAppNum}@s.whatsapp.net`,
            email,
            username,
            password,
            codigo,
          }),
        });

        const data = await res.json();

        if (res.status === 409 && data.error?.includes('já possui')) {
          showMsg('Você já tem uma conta. Redirecionando para o login…', 'info');
          setTimeout(() => window.location.replace('login.html'), 2000);
          return;
        }

        if (res.status === 409) {
          if (data.error?.includes('email')) {
            showMsg('Este email já está sendo usado por outra conta.');
          } else {
            showMsg('Este nome de usuário já está em uso. Escolha outro.');
          }
          return;
        }

        if (!res.ok) {
          showMsg(msgPorStatus(res.status, data.error));
          return;
        }

        showMsg('Conta criada! Redirecionando para o login…', 'success');
        setTimeout(() => window.location.replace('login.html'), 2000);

      } catch {
        showMsg('Não foi possível conectar ao servidor. Tente novamente em instantes.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
